#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 18px 120px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em;line-height:1.05}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.brand{font:800 24px 'Bricolage Grotesque';display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);clip-path:polygon(0 0,100% 12%,88% 100%,10% 86%);animation:wob 5s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.1)}}
.pill{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pill:hover{transform:translateY(-2px) rotate(-2deg)}.pill:active{transform:scale(.92)}
.hb{display:flex;gap:8px}
.hero{font-size:clamp(40px,10vw,68px);font-weight:800;margin-bottom:12px}
.sub{color:var(--mut);max-width:44ch;margin:0 0 26px}
.sav{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--mut);margin-bottom:22px}.sav i{width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 0 4px #12b8a022}
.tk{display:flex;margin-bottom:18px;border-radius:26px;cursor:pointer;position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;filter:drop-shadow(0 14px 18px #1d1a3b26)}
.tk:hover{transform:translateY(-6px) rotate(-.8deg)}.tk:active{transform:scale(.97)}
.tk-m{flex:1;padding:24px;border-radius:26px 0 0 26px;color:#fff;background:var(--g);min-width:0}
.tk-m h3{font-size:30px;margin-bottom:6px}.tk-m p{margin:2px 0;opacity:.92;font-size:15px}
.tk-s{width:118px;background:var(--card);border-radius:0 26px 26px 0;border-left:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:12px}

.tk-s:before,.tk-s:after{content:"";position:absolute;right:107px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk-s:before{top:-11px}.tk-s:after{bottom:-11px}
.big{width:100%;padding:18px;border-radius:22px;background:var(--ink);color:var(--bg);font:700 18px 'Bricolage Grotesque';transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.big:hover{transform:scale(1.02)}.big:active{transform:scale(.96)}
.back{margin-bottom:18px}
.th{border-radius:30px;padding:28px 24px;color:#fff;background:var(--g);margin-bottom:22px;position:relative;overflow:hidden}
.th:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:30px solid #ffffff22}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tab{padding:10px 18px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;white-space:nowrap;transition:all .35s cubic-bezier(.3,1.4,.5,1)}
.tab.on{background:var(--ink);color:var(--bg);transform:scale(1.06)}
.day{margin:26px 0 10px;font:700 20px 'Bricolage Grotesque'}.day small{color:var(--mut);font:500 14px Figtree;margin-left:8px}
.tl{border-left:3px solid var(--line);margin-left:7px;padding-left:20px}
.row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.tl .row:before{content:"";position:absolute;left:-31px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;background:var(--k,var(--a));border:3px solid var(--bg)}
.row b{display:block}.row small{color:var(--mut)}.row .acts{display:flex;gap:6px;flex-shrink:0}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--k,var(--a)) 18%,transparent);color:var(--ink)}
.mini{padding:7px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}.mini.x{color:var(--d)}
.empty{padding:26px;border:2px dashed var(--line);border-radius:20px;color:var(--mut);text-align:center}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;padding:16px 24px;border-radius:99px;background:linear-gradient(135deg,var(--a),var(--d));color:#fff;font:700 17px 'Bricolage Grotesque';box-shadow:0 12px 28px #5b3fd655;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}.fab:hover{transform:scale(1.08) rotate(-2deg)}.fab:active{transform:scale(.9)}
.warn{color:var(--d);font-weight:600}.ok{color:var(--b);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.chk{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.8,.5,1);color:#fff}
.chk.d .box{background:var(--b);border-color:var(--b);transform:rotate(360deg) scale(1.1)}.chk.d span{text-decoration:line-through;color:var(--mut)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:fixed;inset:0;background:#0b0820aa;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20;backdrop-filter:blur(4px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--card);border-radius:34px 34px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%) scale(.96);transition:transform .6s cubic-bezier(.2,1.1,.3,1);box-shadow:0 -20px 60px #0006}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet h2{font-size:30px;margin-bottom:6px}.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:-10px auto 18px}

.step p{margin:2px 0 0;color:var(--mut)}
.plug{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}

.top{margin-bottom:26px}.hero{margin-top:4px}

<main id="app"></main>
<input type="file" accept="image/*" id="pf" hidden><div id="layer"><div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),layer=$('#layer'),sheet=$('#sheet');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const G=['linear-gradient(135deg,#5B3FD6,#FF6F91)','linear-gradient(135deg,#12B8A0,#3F6CF5)','linear-gradient(135deg,#FF8A4C,#D6409F)','linear-gradient(135deg,#2B2A6B,#12B8A0)'];
const TY={flight:['Flight','#5B3FD6'],train:['Train','#12B8A0'],stay:['Stay','#E89B1A'],place:['Place','#FF6F91'],food:['Food','#3F8CF5']};
const PACK=['Passport or ID','Chargers and power bank','Medicines','Cash and cards','Offline maps downloaded'];
const KEY='wayfold1';let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const mk=(o)=>Object.assign({id:uid(),items:[],docs:[],exp:[],people:['You'],pack:PACK.map(t=>({t,d:0})),rate:1},o);
if(!S)S={trips:[],plug:{pack:1,cur:1,count:1,sos:1}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ui={t:null,tab:'plan'},anim=true,help='guide',chat=[];
const cur=()=>S.trips.find(t=>t.id===ui.t);
const D=d=>new Date(d+'T00:00');const fd=d=>D(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const wd=d=>D(d).toLocaleDateString('en-IN',{weekday:'long'});
const away=d=>Math.ceil((D(d)-new Date())/864e5);const R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const days=t=>{const o=[];for(let d=D(t.start);d<=D(t.end)&&o.length<31;d.setDate(d.getDate()+1))o.push(d.toLocaleDateString('sv'));return o};

function home(){return `<div class="top"><div class="brand"><span class="logo"></span>Wayfold</div><nav class="hn"><button class="hl on">Trips</button><button class="hl" data-act="plugins">Plugins</button><button class="hl" data-act="help">Help desk</button><button class="hl" data-act="photo">Photo</button></nav></div>
<p class="eyebrow it" style="--i:0">Your travel companion</p><h1 class="hero it" style="--i:1">Every trip, folded into one place.</h1><p class="sub it" style="--i:2;max-width:52ch">Wayfold keeps your tickets, hotel bookings, documents, plans and spending for each journey together in one folder, so nothing is scattered across emails, screenshots and chats. Plan the days, carry it all offline, and travel without digging for the one thing you need.</p>
<div class="cta it" style="--i:3"><button class="newbtn lg" data-act="newtrip">+ New trip</button><span class="sav" style="margin:0"><i></i>Saved on this device. Works with no signal.</span></div>
${S.trips.length?'<div class="day it" style="--i:4">Your trips</div>':''}
${S.trips.map((t,i)=>{const a=away(t.start),b=away(t.end);const n=b<0?['Done','trip']:a<=0?['Now','on trip']:[a,a==1?'day to go':'days to go'];
return `<article class="tk it" tabindex="0" data-act="open" data-id="${t.id}" style="--i:${i+3};--g:${G[i%4]}"><div class="tk-m"><h3>${esc(t.name)}</h3><p>${esc(t.from)} to ${esc(t.to)}</p><p>${fd(t.start)} to ${fd(t.end)}</p></div><div class="tk-s"><div><b>${n[0]}</b><span>${n[1]}</span></div></div></article>`}).join('')}
<h2 class="sec it" style="--i:6">What Wayfold does</h2>
<div class="fg">${[['One folder per trip','Tickets, hotel bookings, documents and notes all live together, instead of in five different apps.','#5B3FD6'],['Day by day plan','A simple timeline of your flights, stays and places to visit, laid out for every day of the trip.','#FF6F91'],['Works offline','Your plan, booking codes and documents open with no internet, in the airport queue or up a mountain.','#12B8A0'],['Document vault','Keep your passport, ID and visa in one place, with a warning when one is close to expiring.','#E89B1A'],['Costs and splitting','Log what you spend, set a budget and see exactly who owes whom when friends share costs.','#3F8CF5']].map((f,i)=>`<div class="fc it" style="--i:${i+7};--k:${f[2]}"><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join('')}</div>
<h2 class="sec it" style="--i:12">How it works</h2>
<div class="card it" style="--i:13">${[['Create a trip','Pick your dates and where you are headed.'],['Add bookings and documents','Drop in tickets, stays, and your passport or visa.'],['See your timeline','Everything lines up day by day, in order.'],['Open it anywhere','It is all saved on your device, so it works offline.']].map((s,i)=>`<div class="step"><i>${i+1}</i><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}</div>
<h2 class="sec it" style="--i:14">Coming later</h2>
<div class="chips it" style="--i:15">${['Delay alerts','Offline maps','Shared trips','A Today screen'].map(c=>`<span class="chip">${c}</span>`).join('')}</div>
`}

function tabsOf(){const t=[['plan','Plan'],['vault','Vault'],['spend','Spend']];if(S.plug.pack)t.push(['pack','Packing']);if(S.plug.cur)t.push(['cur','Convert']);if(S.plug.sos)t.push(['sos','Emergency']);return t}
function trip(t){const i=S.trips.indexOf(t),a=away(t.start);
return `<button class="pill back" data-act="back">Back to trips</button>
<div class="th it" style="--g:${G[i%4]}"><h2>${esc(t.name)}</h2><p>${esc(t.from)} to ${esc(t.to)}, ${fd(t.start)} to ${fd(t.end)}</p>${S.plug.count?`<span class="cd">${away(t.end)<0?'Trip complete':a<=0?'You are on this trip':a+' days until you leave'}</span>`:''}</div>
<div class="tabs it" style="--i:1">${tabsOf().map(x=>`<button class="tab ${ui.tab==x[0]?'on':''}" data-act="tab" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
${{plan,vault,spend,pack,cur:conv,sos}[ui.tab](t)}
<p style="text-align:center;margin-top:40px"><button class="mini x" data-act="deltrip">Delete this trip</button></p>`}

function plan(t){let n=2;const out=days(t).map(d=>{const its=t.items.filter(x=>x.date==d).sort((a,b)=>a.time.localeCompare(b.time));
return `<div class="day it" style="--i:${n++}">${wd(d)}<small>${fd(d)}</small></div><div class="tl">${its.map(x=>`<div class="row it" style="--i:${n++};--k:${TY[x.type][1]}"><div><span class="tag">${TY[x.type][0]}</span> <small>${x.time}</small><b>${esc(x.title)}</b></div><div class="acts">${x.ref?`<button class="mini" data-act="code" data-id="${x.id}">Show code</button>`:''}<button class="mini x" aria-label="Remove" data-act="delitem" data-id="${x.id}">Remove</button></div></div>`).join('')||`<div class="empty">Nothing planned yet.</div>`}</div>`}).join('');
return out+`<button class="fab" data-act="additem">Add stop</button>`}

function vault(t){const end=D(t.end);return `<div class="it" style="--i:2">${t.docs.map((x,i)=>{let s='<small>No expiry</small>';if(x.expiry){const left=(D(x.expiry)-end)/864e5;s=left<0?`<small class="warn">Expires before your trip ends</small>`:left<183?`<small class="warn">Under 6 months valid at trip end. Many countries refuse entry.</small>`:`<small class="ok">Valid until ${fd(x.expiry)}, ${D(x.expiry).getFullYear()}</small>`}
return `<div class="row it" style="--i:${i+3}"><div><b>${esc(x.name)}</b>${s}</div><button class="mini x" data-act="deldoc" data-id="${x.id}">Remove</button></div>`}).join('')||'<div class="empty">No documents yet. Add your ID, passport or visa.</div>'}</div><button class="fab" data-act="adddoc">Add document</button>`}

function bal(t){const tot=t.exp.reduce((s,x)=>s+x.amt,0),sh=tot/t.people.length,b={};t.people.forEach(p=>b[p]=-sh);t.exp.forEach(x=>{if(b[x.who]!=null)b[x.who]+=x.amt});
const cr=[],db=[];for(const p in b){b[p]>.5?cr.push([p,b[p]]):b[p]<-.5&&db.push([p,-b[p]])}const o=[];
while(cr.length&&db.length){const c=cr[0],d=db[0],m=Math.min(c[1],d[1]);o.push(`${d[0]} pays ${c[0]} ${R(m)}`);c[1]-=m;d[1]-=m;if(c[1]<.5)cr.shift();if(d[1]<.5)db.shift()}return{tot,o}}
const CAT=['Food','Stay','Travel','Shopping','Other'];
function budgetCard(t,tot){const b=t.budget||0;
if(!b)return `<div class="card it" style="--i:1"><b>Trip budget</b><p class="sub" style="margin:6px 0 12px">Set a budget to see how much you have left as you spend.</p><button class="mini" data-act="setbudget">Set budget</button></div>`;
const p=Math.min(100,tot/b*100),left=b-tot,over=left<0;
const cats=CAT.map(c=>[c,t.exp.filter(x=>(x.cat||'Other')==c).reduce((s,x)=>s+x.amt,0)]).filter(x=>x[1]>0);
return `<div class="card it" style="--i:1"><div style="display:flex;justify-content:space-between;align-items:center"><b>Trip budget</b><button class="mini" data-act="setbudget">Change</button></div><h2 style="margin:8px 0">${over?R(-left)+' over':R(left)+' left'}</h2><div class="bar"><i style="width:${p}%;background:${over?'var(--d)':p>80?'var(--c)':'var(--b)'}"></i></div><p style="color:var(--mut);margin:8px 0 0">${R(tot)} of ${R(b)} spent</p><label for="pc">Price check</label><input id="pc" type="number" inputmode="decimal" placeholder="Enter a price to test"><p id="pco" style="margin:8px 0 0;color:var(--mut)">See what you would have left.</p>${cats.length?`<div style="margin-top:14px">${cats.map(c=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin:6px 0"><span>${c[0]}</span><b>${R(c[1])}</b></div>`).join('')}</div>`:''}</div>`}
function spend(t){const {tot,o}=bal(t);return budgetCard(t,tot)+`<div class="card it" style="--i:2"><small>Total spent</small><h2>${R(tot)}</h2><p style="color:var(--mut);margin:4px 0 0">${R(tot/t.people.length)} each across ${t.people.length} people</p></div>
<div class="card it" style="--i:3"><b>Settle up</b>${o.map(x=>`<p style="margin:8px 0">${esc(x)}</p>`).join('')||'<p class="ok">Everyone is even.</p>'}</div>
${t.exp.map((x,i)=>`<div class="row it" style="--i:${i+4}"><div><b>${esc(x.what)}</b><small>${esc(x.cat||'Other')}, paid by ${esc(x.who)}</small></div><div class="acts"><b>${R(x.amt)}</b><button class="mini x" data-act="delexp" data-id="${x.id}">Remove</button></div></div>`).join('')}
<div class="chips it" style="--i:9">${t.people.map(p=>`<span class="tag">${esc(p)}</span>`).join('')}<button class="chip" data-act="addperson">Add a friend</button></div><button class="fab" data-act="addexp">Add cost</button>`}

function pack(t){return `<div class="card it" style="--i:2">${t.pack.map((x,i)=>`<div class="chk ${x.d?'d':''}" data-act="pk" data-id="${i}"><div class="box">${x.d?'✓':''}</div><span>${esc(x.t)}</span></div>`).join('')}
<label for="pk">Add an item</label><div class="two" style="grid-template-columns:1fr auto"><input id="pk" placeholder="Sunscreen"><button class="mini" data-act="pkadd">Add</button></div></div><p class="sub">${t.pack.filter(x=>x.d).length} of ${t.pack.length} packed.</p>`}
function conv(t){return `<div class="card it" style="--i:2"><b>Offline currency converter</b><p class="sub" style="margin:4px 0">Enter the last rate you saw. It stays on this device.</p>
<label for="cv1">Amount in foreign currency</label><input id="cv1" type="number" inputmode="decimal" value="100"><label for="cv2">1 foreign unit equals (₹)</label><input id="cv2" type="number" inputmode="decimal" value="${t.rate}"><h2 id="cvo" style="margin-top:18px">${R(100*t.rate)}</h2></div>`}
function sos(t){return `<div class="card it" style="--i:2"><h3>Emergency card</h3><p class="sub" style="margin:6px 0">India numbers, ready without internet.</p>${[['All emergencies','112'],['Ambulance','108'],['Police','100'],['Women helpline','1091']].map(x=>`<div class="row"><b>${x[0]}</b><a class="mini" href="tel:${x[1]}">Call ${x[1]}</a></div>`).join('')}<p class="sub" style="margin-bottom:0">Add your insurer’s helpline and blood group in Vault as a document name.</p></div>`}

function open(html){sheet.innerHTML=`<div class="grab"></div>`+html;layer.classList.add('open')}
const close=()=>layer.classList.remove('open');
const F=(id,l,t='text',v='',p='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" placeholder="${p}">`;
const V=id=>$('#'+id)?.value.trim()||'';
const sheets={
newtrip:()=>`<h2>New trip</h2><div class="two"><div>${F('n4','Start date','date')}</div><div>${F('n5','End date','date')}</div></div>${F('n1','Trip name','text','','Goa with friends')}<div class="two"><div>${F('n2','From','text','Bhopal')}</div><div>${F('n3','To')}</div></div><button class="big" style="margin-top:22px" data-act="savetrip">Create trip</button>`,
additem:t=>`<h2>Add a stop</h2><label for="i1">Type</label><select id="i1">${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>${F('i2','What is it?','text','','Train to the city')}<div class="two"><div><label for="i3">Day</label><select id="i3">${days(t).map(d=>`<option value="${d}">${wd(d)}, ${fd(d)}</option>`).join('')}</select></div><div>${F('i4','Time','time','09:00')}</div></div>${F('i5','Booking code (optional)','text','','PNR or booking ID')}<button class="big" style="margin-top:22px" data-act="saveitem">Save stop</button>`,
adddoc:()=>`<h2>Add document</h2>${F('d1','Name','text','','Passport')}${F('d2','Expiry date (optional)','date')}<button class="big" style="margin-top:22px" data-act="savedoc">Save document</button>`,
addexp:t=>`<h2>Add a cost</h2>${F('e1','What was it for?','text','','Dinner')}${F('e2','Amount in ₹','number')}<label for="e4">Category</label><select id="e4">${CAT.map(c=>`<option>${c}</option>`).join('')}</select><label for="e3">Paid by</label><select id="e3">${t.people.map(p=>`<option>${esc(p)}</option>`).join('')}</select><p class="sub">Costs are split equally between everyone on the trip.</p><button class="big" data-act="saveexp">Save cost</button>`,
setbudget:t=>`<h2>Trip budget</h2>${F('b1','Total budget in ₹','number',t.budget||'')}<p class="sub">Every cost you add counts against this.</p><button class="big" data-act="savebudget">Save budget</button>`,
addperson:()=>`<h2>Add a friend</h2>${F('p1','Name')}<button class="big" style="margin-top:22px" data-act="saveperson">Add to trip</button>`};

const GUIDE=[['Create a trip','Tap Start a new trip, enter the name, route and dates, then Create trip.'],['Add stops','Open the Plan tab and tap Add stop. Pick a type, day and time. Add a booking code to get a Show code button.'],['Show a ticket','Tap Show code on any stop. The code opens full screen and needs no internet.'],['Keep documents','Use the Vault tab to add your ID, passport or visa. Add an expiry date to get alerts.'],['Track costs','In Spend, set a budget, add friends, then log each cost with a category. Price check shows what is left, and Settle up shows who pays whom.'],['Turn on plugins','Tap Plugins on the home screen to switch tools like Packing, Convert and Emergency on or off.']];
const RULES=['All data is stored on this device only. Clearing browser data deletes your trips.','Nothing syncs between devices yet, and there is no email import in this version.','Costs are always split equally between everyone on the trip.','A passport with under six months left at trip end gets a warning.','Stops and documents can be removed but not edited. Remove and add again to change one.','The help desk answers questions about Wayfold only.'];
const KB=[[['create','new trip','start','begin'],'Tap Start a new trip on the home screen, fill in the name, route and dates, then tap Create trip. A day-by-day plan opens ready for stops.'],
[['add','booking','ticket','flight','train','hotel','stay','stop','itinerary','plan'],'Open your trip, stay on the Plan tab and tap Add stop. Choose the type, day and time, and add a booking code if you have one.'],
[['offline','internet','signal','network','wifi','airplane'],'Everything is saved on your device the moment you add it, so your plan, codes and documents open with no signal. Only the fonts need a connection the first time.'],
[['passport','visa','expiry','expire','document','vault','id','aadhaar'],'Add documents in the Vault tab. If you set an expiry, Wayfold warns you when less than six months remain on the day your trip ends.'],
[['split','expense','cost','spend','owe','settle','friend','money','pay'],'In Spend, tap Add a friend, then Add cost and choose who paid. Costs split equally, and Settle up lists exactly who pays whom.'],
[['budget','price check','afford','left','limit','record'],'In Spend, tap Set budget and enter your total in ₹. Every cost you add counts against it, and Price check shows what you would have left before you buy.'],
[['plugin','extension','tool','addon'],'Tap Plugins on the home screen. Packing, Convert, Countdown and Emergency can each be switched on or off, and their tabs appear or disappear in your trip.'],
[['pack','packing','checklist'],'Switch on the Packing plugin. Each trip gets a checklist you can tick off and add to.'],
[['currency','convert','rate','dollar','euro'],'Switch on the Convert plugin, then type the foreign amount and the rate you last saw. It works offline.'],
[['delete','remove','edit','change','undo'],'Use Remove next to a stop, document or cost. Editing is not available yet, so remove and add it again. Delete this trip sits at the bottom of each trip.'],
[['data','privacy','safe','backup','sync','device','secure','lost'],'Your data stays on this device only. Nothing is uploaded, and there is no sync or backup yet, so clearing browser data erases your trips.'],
[['code','qr','scan','barcode','pnr'],'Tap Show code on a stop to see its booking code in large type. Wayfold stores the code you type; it does not generate scannable tickets.'],
[['email','import','forward','gmail'],'Email import is not in this version. Add bookings by hand from the Plan tab for now.'],
[['emergency','sos','police','ambulance','help number'],'Switch on the Emergency plugin to get a card with India’s emergency numbers that works offline.'],
[['countdown','days left','timer'],'The Countdown plugin shows days until departure at the top of each trip.'],
[['hello','hi','hey','what can you'],'I can explain how to create trips, add stops, keep documents, split costs and use plugins. Try one of the questions below.']];
const CH=['How do I add a ticket?','Does it work offline?','How are costs split?','Is my data safe?','What plugins exist?'];
function ask(q){q=q.toLowerCase();let best=0,a=null;KB.forEach(([k,r])=>{const s=k.filter(w=>(' '+q.replace(/[^a-z ]/g,' ')+' ').includes(' '+w+' ')||(w.length>3&&q.includes(w))).length;if(s>best){best=s;a=r}});
return a||'That is outside what I can help with. I only answer questions about using Wayfold.'}
function helpHtml(){const tb=['guide','rules','ask'];
const body=help=='guide'?GUIDE.map((s,i)=>`<div class="step"><i>${i+1}</i><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join(''):help=='rules'?RULES.map(r=>`<div class="row"><span>${r}</span></div>`).join(''):
`<div id="chat">${chat.map(c=>`<div class="bub ${c[0]}">${esc(c[1])}</div>`).join('')||'<div class="bub ai">Ask me anything about using Wayfold.</div>'}</div><div class="chips">${CH.map(c=>`<button class="chip" data-act="chip" data-id="${c}">${c}</button>`).join('')}</div><div class="two" style="grid-template-columns:1fr auto"><input id="q" placeholder="Type your question" aria-label="Your question"><button class="mini" data-act="send">Ask</button></div>`;
return `<h2>Help desk</h2><div class="tabs">${tb.map(x=>`<button class="tab ${help==x?'on':''}" data-act="htab" data-id="${x}">${x=='ask'?'Ask':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${body}`}
function plugHtml(){const P=[['count','Countdown','Days until departure on each trip.'],['pack','Packing list','A checklist for every trip.'],['cur','Currency converter','Convert costs with your own rate, offline.'],['sos','Emergency card','India emergency numbers at one tap.']];
return `<h2>Plugins</h2><p class="sub">Switch tools on or off. Changes show in every trip.</p>${P.map(p=>`<div class="plug"><div><b>${p[1]}</b><br><small style="color:var(--mut)">${p[2]}</small></div><button class="sw ${S.plug[p[0]]?'on':''}" role="switch" aria-checked="${!!S.plug[p[0]]}" aria-label="${p[1]}" data-act="tg" data-id="${p[0]}"></button></div>`).join('')}`}

const TC=[['#5B3FD6','#FF6F91'],['#12B8A0','#3F6CF5'],['#FF8A4C','#D6409F'],['#2B2A6B','#12B8A0']];
function render(){app.className=anim?'anim':'';anim=false;const t=cur(),c=TC[t?S.trips.indexOf(t)%4:0],r=document.documentElement.style;r.setProperty('--t1',c[0]);r.setProperty('--t2',c[1]);app.innerHTML=t?trip(t):home()}
function nav(fn,e){anim=true;const go=()=>{fn();render()};if(!document.startViewTransition||matchMedia('(prefers-reduced-motion:reduce)').matches)return go();
const r=e&&e.clientX!=null&&e.clientX>0?[e.clientX,e.clientY]:[innerWidth/2,innerHeight/2];document.documentElement.style.setProperty('--x',r[0]+'px');document.documentElement.style.setProperty('--y',r[1]+'px');document.startViewTransition(go)}
const refresh=()=>{save();render()};
const A={
open:(e,id)=>nav(()=>{ui={t:id,tab:'plan'}},e),back:e=>nav(()=>{ui={t:null,tab:'plan'}},e),
tab:(e,id)=>{anim=true;ui.tab=id;render()},
newtrip:()=>open(sheets.newtrip()),additem:()=>open(sheets.additem(cur())),adddoc:()=>open(sheets.adddoc()),addexp:()=>open(sheets.addexp(cur())),addperson:()=>open(sheets.addperson()),
plugins:()=>open(plugHtml()),help:()=>open(helpHtml()),close,
savetrip:e=>{const n=V('n1')||V('n3')||'New trip',s=V('n4'),en=V('n5');if(!n||!s||!en||en<s){return toast('Enter a name, a start date, and an end date on or after the start.')}const t=mk({name:n,from:V('n2')||'Home',to:V('n3')||'Somewhere',start:s,end:en});S.trips.unshift(t);save();close();nav(()=>{ui={t:t.id,tab:'plan'}},e)},
saveitem:()=>{const t=cur(),ti=V('i2');if(!ti)return toast('Give the stop a name.');t.items.push({id:uid(),type:V('i1'),title:ti,date:V('i3'),time:V('i4')||'09:00',ref:V('i5')});close();anim=true;refresh()},
savedoc:()=>{const n=V('d1');if(!n)return toast('Give the document a name.');cur().docs.push({id:uid(),name:n,expiry:V('d2')});close();anim=true;refresh()},
saveexp:()=>{const a=parseFloat(V('e2'));if(!V('e1')||!(a>0))return toast('Enter what it was for and an amount above zero.');cur().exp.push({id:uid(),what:V('e1'),amt:a,who:V('e3'),cat:V('e4')});close();anim=true;refresh()},
setbudget:()=>open(sheets.setbudget(cur())),savebudget:()=>{const b=parseFloat(V('b1'));if(!(b>0))return toast('Enter a budget above zero.');cur().budget=b;close();anim=true;refresh()},
saveperson:()=>{const n=V('p1');if(!n)return toast('Enter a name.');const t=cur();if(!t.people.includes(n))t.people.push(n);close();anim=true;refresh()},
delitem:(e,id)=>{const t=cur();t.items=t.items.filter(x=>x.id!=id);refresh()},deldoc:(e,id)=>{const t=cur();t.docs=t.docs.filter(x=>x.id!=id);refresh()},delexp:(e,id)=>{const t=cur();t.exp=t.exp.filter(x=>x.id!=id);refresh()},
deltrip:()=>open(`<h2>Delete this trip?</h2><p class="sub">This removes the trip and all its stops, documents and costs from this device. It cannot be undone.</p><button class="big" style="background:var(--d);color:#fff" data-act="deltripyes">Yes, delete trip</button><button class="big" style="margin-top:10px;background:var(--line);color:var(--ink)" data-act="close">Cancel</button>`),deltripyes:e=>{S.trips=S.trips.filter(x=>x.id!=ui.t);save();close();nav(()=>{ui={t:null,tab:'plan'}},e)},
code:(e,id)=>{const x=cur().items.find(i=>i.id==id);open(`<span class="tag" style="--k:${TY[x.type][1]}">${TY[x.type][0]}</span><h2 style="margin-top:8px">${esc(x.title)}</h2><p class="sub">${wd(x.date)}, ${fd(x.date)} at ${x.time}</p><div class="code">${esc(x.ref)}</div><button class="big" data-act="close">Done</button>`)},
pk:(e,id)=>{const p=cur().pack[id];p.d=p.d?0:1;refresh()},pkadd:()=>{const v=V('pk');if(v){cur().pack.push({t:v,d:0});refresh()}},
tg:(e,id)=>{S.plug[id]=S.plug[id]?0:1;if(!S.plug[ui.tab])ui.tab='plan';save();sheet.querySelector('.sw[data-id="'+id+'"]').classList.toggle('on');render()},
htab:(e,id)=>{help=id;open(helpHtml())},
chip:(e,id)=>say(id),photo:()=>open(`<h2>Background photo</h2><p class="sub">Pick any scenic photo from your device. It is saved on this device and used behind every screen.</p><button class="big" data-act="pickphoto">Choose a photo</button>${S.bg?'<button class="big" style="margin-top:10px;background:var(--line);color:var(--ink)" data-act="rmphoto">Use the default mountain photo</button>':''}`),pickphoto:()=>$('#pf').click(),rmphoto:()=>{S.bg=null;save();applyBg();close()},send:()=>{const q=V('q');if(q)say(q)}};
function say(q){chat.push(['me',q],['ai',ask(q)]);open(helpHtml());sheet.scrollTop=sheet.scrollHeight}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];f&&f(e,b.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if(e.key=='Enter'){if(e.target.id=='q')A.send();else if(e.target.dataset?.act=='open')A.open(e,e.target.dataset.id)}});
document.addEventListener('input',e=>{if(e.target.id=='n4'||e.target.id=='n5'){const s=V('n4'),en=V('n5'),o=$('#dsum');if($('#n5')&&s)$('#n5').min=s;if(o)o.textContent=s&&en?(en<s?'End date must be on or after the start.':(Math.round((D(en)-D(s))/864e5)+1)+' days, '+fd(s)+' to '+fd(en)):s?'Now pick an end date.':'Pick your dates to begin.'}if(e.target.id=='pc'){const t=cur(),v=parseFloat(e.target.value)||0,l=t.budget-bal(t).tot-v;$('#pco').textContent=v?(l>=0?'Fits. You would have '+R(l)+' left.':'Over budget by '+R(-l)+'.'):'See what you would have left.'}if(e.target.id=='cv1'||e.target.id=='cv2'){const a=parseFloat($('#cv1').value)||0,r=parseFloat($('#cv2').value)||0;cur().rate=r;save();$('#cvo').textContent=R(a*r)}});
